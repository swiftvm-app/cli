[workspace]
resolver = "3"
members = ["crates/*", "spikes/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
disk = { path = "crates/disk" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
